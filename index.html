<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eyesightworks | Web Developer, Brand Identity, Translator" />
  <title>Eyesightworks | Web Developer & Brand Identity</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  <style>
    /* Minimal fallback */
    .nav-menu {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hamburger {
      display: none;
    }

    @media (max-width: 768px) {
      .hamburger {
        display: block;
        background: none;
        border: none;
        font-size: 2rem;
      }

      .nav-menu {
        display: none;
        flex-direction: column;
        gap: 0.5rem;
      }

      .nav-menu.show {
        display: flex;
      }
    }

    .lang-switcher-button {
      background: none;
      border: 1px solid #ccc;
      padding: 0.4em 0.8em;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container nav-container">
      <div class="logo">Eyesightworks</div>
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation">&#9776;</button>
      <nav class="nav-menu" id="nav-menu" role="navigation">
        <a href="index.html" class="active" data-en="Home" data-fr="Accueil" data-es="Inicio" data-ar="الرئيسية">Home</a>
        <a href="about.html" data-en="About" data-fr="À propos" data-es="Sobre" data-ar="من نحن">About</a>
        <a href="services.html" data-en="Services" data-fr="Services" data-es="Servicios" data-ar="الخدمات">Services</a>
        <a href="portfolio.html" data-en="Portfolio" data-fr="Portfolio" data-es="Portafolio" data-ar="الأعمال">Portfolio</a>
        <a href="testimonials.html" data-en="Testimonials" data-fr="Témoignages" data-es="Testimonios" data-ar="آراء العملاء">Testimonials</a>
        <a href="contact.html" data-en="Contact" data-fr="Contact" data-es="Contacto" data-ar="اتصل بنا">Contact</a>
        <button id="lang-switcher" class="lang-switcher-button" aria-label="Switch language">FR</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-content">
      <h1 data-en="Elevate Your Brand with Eyesightworks"
          data-fr="Élevez votre marque avec Eyesightworks"
          data-es="Eleva tu marca con Eyesightworks"
          data-ar="ارتقِ بعلامتك التجارية مع Eyesightworks">
        Elevate Your Brand with Eyesightworks
      </h1>
      <p data-en="Web Developer | Brand Identity Expert | Translator"
         data-fr="Développeur Web | Expert en Identité Visuelle | Traducteur"
         data-es="Desarrollador Web | Experto en Identidad de Marca | Traductor"
         data-ar="مطور ويب | خبير هوية العلامة التجارية | مترجم">
        Web Developer | Brand Identity Expert | Translator
      </p>
      <a href="contact.html" class="download-btn"
         data-en="Let's Talk" data-fr="Discutons" data-es="Hablemos" data-ar="تواصل معنا">Let's Talk</a>
    </div>
  </section>

  <footer class="footer">
    <p data-en="&copy; 2025 Eyesightworks. All rights reserved."
       data-fr="&copy; 2025 Eyesightworks. Tous droits réservés."
       data-es="&copy; 2025 Eyesightworks. Todos los derechos reservados."
       data-ar="&copy; 2025 Eyesightworks. جميع الحقوق محفوظة.">
      &copy; 2025 Eyesightworks. All rights reserved.
    </p>
  </footer>

  <script>
    const hamburger = document.getElementById("hamburger");
    const navMenu = document.getElementById("nav-menu");
    const langSwitcher = document.getElementById("lang-switcher");
    const html = document.documentElement;

    const languages = ["en", "fr", "es", "ar"];
    let currentLangIndex = 0;

    // Load saved language
    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem("preferredLang");
      if (savedLang && languages.includes(savedLang)) {
        currentLangIndex = languages.indexOf(savedLang);
        switchLanguage(savedLang);
      }
    });

    hamburger.addEventListener("click", () => {
      navMenu.classList.toggle("show");
    });

    langSwitcher.addEventListener("click", () => {
      currentLangIndex = (currentLangIndex + 1) % languages.length;
      const newLang = languages[currentLangIndex];
      switchLanguage(newLang);
      localStorage.setItem("preferredLang", newLang);
    });

    function switchLanguage(lang) {
      html.lang = lang;
      html.dir = lang === "ar" ? "rtl" : "ltr";
      langSwitcher.textContent = lang.toUpperCase();

      document.querySelectorAll("[data-" + lang + "]").forEach(el => {
        el.textContent = el.getAttribute("data-" + lang);
      });
    }
  </script>
</body>
</html>
