<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eyesightworks | Website Developer & Brand Identity Expert" />
  <title>Eyesightworks | Home</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600;800&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
</head>

<body>
  <!-- Header / Navigation -->
  <header class="header">
    <div class="container nav-container">
      <div class="logo">Eyesightworks</div>
      <nav id="nav-menu" class="nav-menu">
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="contact.html">Contact</a>
        <select id="lang-switcher" aria-label="Language Switcher">
          <option value="en" selected>EN</option>
          <option value="fr">FR</option>
          <option value="es">ES</option>
          <option value="ar">AR</option>
        </select>
      </nav>
      <button class="hamburger" aria-label="Menu" onclick="toggleMenu()">☰</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1 id="hero-title">Crafting Brands. Building Digital Futures.</h1>
      <p id="hero-subtitle">Website Developer & Brand Identity Expert</p>
      <a href="eyesightworks_business_card.pdf" class="download-btn" download>📎 Download My Business Card</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Eyesightworks. All rights reserved.</p>
  </footer>

  <!-- JavaScript for Menu + Language Toggle -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById("nav-menu");
      menu.classList.toggle("show");
    }

    const translations = {
      en: {
        heroTitle: "Crafting Brands. Building Digital Futures.",
        heroSubtitle: "Website Developer & Brand Identity Expert"
      },
      fr: {
        heroTitle: "Créer des marques. Construire des avenirs numériques.",
        heroSubtitle: "Développeur de sites web et expert en identité de marque"
      },
      es: {
        heroTitle: "Creando marcas. Construyendo futuros digitales.",
        heroSubtitle: "Desarrollador web y experto en identidad de marca"
      },
      ar: {
        heroTitle: "بناء العلامات التجارية. وصناعة المستقبل الرقمي.",
        heroSubtitle: "مطور مواقع وخبير في الهوية البصرية"
      }
    };

    document.getElementById("lang-switcher").addEventListener("change", function () {
      const lang = this.value;
      document.getElementById("hero-title").textContent = translations[lang].heroTitle;
      document.getElementById("hero-subtitle").textContent = translations[lang].heroSubtitle;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    });
  </script>
</body>
</html>
