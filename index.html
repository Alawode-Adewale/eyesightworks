<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eyesightworks | Web Developer & Brand Identity Expert">
  <title>Eyesightworks | Web Developer & Brand Identity</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet" />
  
  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container nav-container">
      <div class="logo">Eyesightworks</div>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <nav class="nav" id="nav">
        <ul class="nav-links">
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="testimonials.html">Testimonials</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Creative Web Development & Brand Strategy</h1>
      <p class="tagline">Helping your brand stand out through elegant, accessible, and fast digital solutions.</p>
      <a href="contact.html" class="btn-primary">Let’s Work Together</a>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section class="contact-form">
    <h2>Get in Touch</h2>
    <form action="#" method="POST">
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <textarea name="message" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Eyesightworks. All rights reserved.</p>
  </footer>

  <!-- JavaScript for Menu Toggle -->
  <script>
    function toggleMenu() {
      document.getElementById("nav").classList.toggle("nav-open");
    }
  </script>

</body>
</html>
