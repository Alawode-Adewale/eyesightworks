<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eyesightworks | Website Developer & Brand Identity Expert" />
  <meta property="og:title" content="Eyesightworks - Website & Brand Expert" />
  <meta property="og:description" content="Crafting brands and building digital futures." />
  <meta property="og:image" content="images/eyesightworks-preview.png" />
  <meta property="og:type" content="website" />
  <title>Eyesightworks | Home</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Header / Navigation -->
  <header class="header">
    <div class="logo">Eyesightworks</div>
    <nav id="nav-menu" class="nav-menu">
      <a href="index.html" class="active">Home</a>
      <a href="service.html">Services</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
      <select class="language-switcher" aria-label="Language Switcher">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="es">ES</option>
      </select>
    </nav>
    <button class="hamburger" aria-label="Toggle Menu" onclick="toggleMenu()">☰</button>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Hello, I'm a Website Developer & Brand Identity Expert</h1>
    <p class="tagline">Crafting Brands. Building Digital Futures.</p>
    <a href="eyesightworks_business_card.pdf" class="download-btn" download>📎 Download My Business Card</a>
  </section>

  <!-- Scroll-to-Top Button -->
  <button id="scrollBtn" onclick="scrollToTop()" title="Back to top">↑</button>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Eyesightworks. All rights reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    // Toggle mobile menu
    function toggleMenu() {
      const menu = document.getElementById('nav-menu');
      menu.classList.toggle('show');
    }

    // Scroll to top
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Show scroll button when page is scrolled
    window.addEventListener('scroll', () => {
      const scrollBtn = document.getElementById('scrollBtn');
      scrollBtn.style.display = window.scrollY > 300 ? 'block' : 'none';
    });
  </script>
</body>
</html>
