<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eyesightworks | Website Developer & Brand Identity Expert" />
  <title>Eyesightworks | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/favicon.ico" />
</head>

<body>
  <!-- Language Toggle -->
  <div class="lang-switcher">
    <select id="languageSelect" onchange="switchLanguage()">
      <option value="en">EN</option>
      <option value="fr">FR</option>
      <option value="es">ES</option>
      <option value="ar">AR</option>
    </select>
  </div>

  <!-- Header / Navbar -->
  <header class="header">
    <div class="container">
      <div class="logo">Eyesightworks</div>
      <nav id="nav-menu" class="nav-menu">
        <a href="index.html" class="nav-link" data-key="home">Home</a>
        <a href="about.html" class="nav-link" data-key="about">About</a>
        <a href="services.html" class="nav-link" data-key="services">Services</a>
        <a href="portfolio.html" class="nav-link" data-key="portfolio">Portfolio</a>
        <a href="testimonials.html" class="nav-link" data-key="testimonials">Testimonials</a>
        <a href="contact.html" class="nav-link" data-key="contact">Contact</a>
      </nav>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1 data-key="hero_title">Crafting Digital Futures with Design & Code</h1>
      <p data-key="hero_subtitle">Website Developer & Brand Identity Expert</p>
      <a href="contact.html" class="btn-primary" data-key="cta">Let's Work Together</a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2025 Eyesightworks. <span data-key="rights">All rights reserved.</span></p>
    </div>
  </footer>

  <!-- Language Script -->
  <script>
    const translations = {
      en: {
        home: "Home",
        about: "About",
        services: "Services",
        portfolio: "Portfolio",
        testimonials: "Testimonials",
        contact: "Contact",
        hero_title: "Crafting Digital Futures with Design & Code",
        hero_subtitle: "Website Developer & Brand Identity Expert",
        cta: "Let's Work Together",
        rights: "All rights reserved."
      },
      fr: {
        home: "Accueil",
        about: "À propos",
        services: "Services",
        portfolio: "Portfolio",
        testimonials: "Témoignages",
        contact: "Contact",
        hero_title: "Créer des futurs numériques avec design et code",
        hero_subtitle: "Développeur Web & Expert en Identité Visuelle",
        cta: "Travaillons ensemble",
        rights: "Tous droits réservés."
      },
      es: {
        home: "Inicio",
        about: "Acerca de",
        services: "Servicios",
        portfolio: "Portafolio",
        testimonials: "Testimonios",
        contact: "Contacto",
        hero_title: "Creando futuros digitales con diseño y código",
        hero_subtitle: "Desarrollador web y experto en identidad de marca",
        cta: "Trabajemos juntos",
        rights: "Todos los derechos reservados."
      },
      ar: {
        home: "الرئيسية",
        about: "من نحن",
        services: "الخدمات",
        portfolio: "الأعمال",
        testimonials: "آراء العملاء",
        contact: "اتصل بنا",
        hero_title: "نبني مستقبلًا رقميًا بالتصميم والبرمجة",
        hero_subtitle: "مطور مواقع وخبير في الهوية البصرية",
        cta: "دعنا نبدأ العمل",
        rights: "جميع الحقوق محفوظة."
      }
    };

    function switchLanguage() {
      const selectedLang = document.getElementById("languageSelect").value;
      document.documentElement.lang = selectedLang;
      document.documentElement.dir = selectedLang === "ar" ? "rtl" : "ltr";

      document.querySelectorAll("[data-key]").forEach(el => {
        const key = el.getAttribute("data-key");
        if (translations[selectedLang][key]) {
          el.textContent = translations[selectedLang][key];
        }
      });
    }

    function toggleMenu() {
      document.getElementById("nav-menu").classList.toggle("show");
    }
  </script>
</body>
</html>
